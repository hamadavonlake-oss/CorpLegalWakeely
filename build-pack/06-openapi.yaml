openapi: 3.0.3
info:
  title: Global Legal Operations API
  version: 1.0.0
  description: Tenant-isolated MVP API.
servers:
  - url: https://api.example.com/api/v1
security:
  - bearerAuth: []
tags:
  - name: Organizations
  - name: Requests
  - name: Matters
  - name: Contracts
  - name: Documents
  - name: Approvals
  - name: Search
  - name: Audit
paths:
  /organizations/me:
    get:
      tags: [Organizations]
      summary: Get current organization
      responses:
        '200': {description: Organization}
  /legal-requests:
    get:
      tags: [Requests]
      summary: List requests
      responses:
        '200': {description: Request list}
    post:
      tags: [Requests]
      summary: Create request
      responses:
        '201': {description: Created}
  /legal-requests/{id}:
    get: {tags: [Requests], summary: Get request, responses: {'200': {description: Request}}}
    patch: {tags: [Requests], summary: Update request, responses: {'200': {description: Updated}}}
  /matters:
    get: {tags: [Matters], summary: List matters, responses: {'200': {description: Matter list}}}
    post: {tags: [Matters], summary: Create matter, responses: {'201': {description: Created}}}
  /matters/{id}:
    get: {tags: [Matters], summary: Get matter, responses: {'200': {description: Matter}}}
    patch: {tags: [Matters], summary: Update matter, responses: {'200': {description: Updated}}}
  /contracts:
    get: {tags: [Contracts], summary: List contracts, responses: {'200': {description: Contract list}}}
    post: {tags: [Contracts], summary: Create contract, responses: {'201': {description: Created}}}
  /contracts/{id}/submit-review:
    post: {tags: [Contracts], summary: Submit for review, responses: {'202': {description: Submitted}}}
  /contracts/{id}/approvals:
    get: {tags: [Approvals], summary: List approvals, responses: {'200': {description: Approval list}}}
  /approvals/{id}/decision:
    post: {tags: [Approvals], summary: Approve/reject/request changes, responses: {'200': {description: Decision recorded}}}
  /documents:
    post: {tags: [Documents], summary: Upload document, responses: {'201': {description: Uploaded}}}
  /documents/{id}/versions:
    get: {tags: [Documents], summary: List versions, responses: {'200': {description: Versions}}}
  /documents/{id}/export:
    post: {tags: [Documents], summary: Export PDF or DOCX, responses: {'202': {description: Export job}}}
  /search:
    get: {tags: [Search], summary: Tenant-scoped search, responses: {'200': {description: Search results}}}
  /audit-events:
    get: {tags: [Audit], summary: List audit events, responses: {'200': {description: Audit events}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
